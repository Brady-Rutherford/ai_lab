[project]
name = "minerva-gpt"
version = "0.1.0"
description = "Post-train an open base model to answer like me in class (data stays local)"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "transformers",
    "peft",
    "trl",
    "datasets",
    "accelerate",
    "sentence-transformers",
    "rank-bm25",
    "scikit-learn",
    "pandas",
    "pyarrow",
    "python-dotenv",
]

[project.optional-dependencies]
gpu = [
    "kernels>=0.17.2,<0.18.0",  # the range transformers 5.21 accepts; 0.18 silently disables hub kernels
    "liger-kernel>=0.8.5 ; sys_platform == 'linux'",
]
mac = [
    "mlx-lm>=0.32.2 ; sys_platform == 'darwin'",
]

[tool.uv]
package = false
